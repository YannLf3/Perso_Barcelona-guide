<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sunset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54A"/>
      <stop offset="55%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="64" height="64" rx="12" fill="url(#sunset)"/>

  <!-- Soleil rétro -->
  <circle cx="32" cy="28" r="16" fill="#FFE8A3" opacity="0.35"/>

  <!-- Rayons -->
  <g stroke="#FFE8A3" stroke-width="2" opacity="0.45">
    <line x1="32" y1="8" x2="32" y2="16"/>
    <line x1="32" y1="40" x2="32" y2="48"/>
    <line x1="12" y1="28" x2="20" y2="28"/>
    <line x1="44" y1="28" x2="52" y2="28"/>
  </g>

  <!-- Monogramme -->
  <text
    x="32"
    y="41"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="24"
    font-weight="700"
    fill="#5B2A00"
    filter="url(#shadow)">
    BT
  </text>

  <!-- Ligne vintage -->
  <path
    d="M14 50 Q32 44 50 50"
    fill="none"
    stroke="#5B2A00"
    stroke-width="2"
    opacity="0.5"/>
</svg>