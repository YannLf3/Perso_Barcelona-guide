<section class="admin-block">
  <h2>Image gallery</h2>

  <form class="image-upload-form">
    <label>
      Upload an image
      <input
        type="file"
        name="image"
        accept="image/jpeg,image/png,image/webp"
        required
      />
    </label>

    <button type="submit">Upload image</button>
  </form>

  <div class="image-gallery" data-image-gallery></div>
</section>
