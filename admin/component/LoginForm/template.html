<form class="admin-login-form" onsubmit="{{handlerLogin}}; return false;">
  <!--return false pour empêcher le rechargement de la page-->
  <h2>Accès <span>Admin</span></h2>
  <label>
    Mot de passe
    <input
      type="password"
      name="password"
      placeholder="••••••••"
      required
      autocomplete="current-password"
    />
  </label>
  <button type="submit">Se connecter →</button>
</form>
