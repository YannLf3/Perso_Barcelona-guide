<article
  class="monument-card monument-card--interactive"
  data-monument-id="{{id}}"
  tabindex="0"
  role="button"
  aria-label="{{ariaLabel}}"
>
  <div class="monument-card__img-wrap">{{imgHtml}}</div>
  <div class="monument-card__body">
    {{districtHtml}}
    <h3 class="monument-card__name">{{name}}</h3>
    <p class="monument-card__desc">{{description}}</p>
  </div>
</article>
